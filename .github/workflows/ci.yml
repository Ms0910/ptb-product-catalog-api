name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ProductCatalog.slnx

      - name: Build
        run: dotnet build ProductCatalog.slnx --configuration Release --no-restore

      # Los tests de integración levantan PostgreSQL con Testcontainers (Docker está disponible en los runners de GitHub).
      - name: Test
        run: >
          dotnet test ProductCatalog.slnx
          --configuration Release
          --no-build
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ptb-product-catalog-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
